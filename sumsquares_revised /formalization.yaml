# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Metadata for the Lean formalization accompanying the paper
# "On the polynomial values represented by quadratic forms"
# (Bogdan Grechuk and Jamal Agbanwa), in the mathlib-initiative
# formalization.yaml v0.4 self-reporting format.
version: "v0.4"

project:
  name: polynomial-values-represented-by-quadratic-forms
  description: >-
    Lean 4 formalization of the paper "On the polynomial values represented by
    quadratic forms". The development proves, with no sorry and no added axiom,
    that x^6 - 4 is a sum of two squares for infinitely many integers x, and
    hence that the Diophantine equation y^2 + x^3 y + z^2 + 1 = 0 has infinitely
    many integer solutions (Proposition 3.1: this was the shortest equation, in
    the paper's length ordering, whose finiteness problem was open). It also
    formalizes the four further length-9 equations of Proposition 3.2, the
    general tangent construction of Section 4 for an arbitrary non-degenerate
    binary quadratic form (Propositions 4.1, 4.2 and Algorithms 2.2, 4.3), the
    two equations 2y^2 + yz + 2z^2 = x^3 +- 1 of Proposition 4.4, the
    non-multiplicativity of the form 2y^2 + yz + 2z^2, and the degenerate case
    of a form of discriminant zero. Supporting theory proved from scratch
    includes property (*) of the sums of two squares and Gauss's theorem on
    generalised Pell equations, together with a residue-controlled refinement of
    the latter.
  authors:
    - Bogdan Grechuk
    - Jamal Agbanwa
  responsible_maintainers:
    - Bogdan Grechuk
  # No LICENSE file has been added to this repository yet; the licence is for
  # the authors to choose, and a LICENSE file at the repository root should be
  # added (and this field updated to match) before any registry submission.
  license: "unspecified: add a LICENSE file at the repository root and record it here"

repository:
  role: substantive-development

classification:
  arxiv: ["math.NT"]
  msc2020: ["11D09", "11D45", "11E16", "11D25"]

sources:
  - title: On the polynomial values represented by quadratic forms
    authors:
      - Bogdan Grechuk
      - Jamal Agbanwa
    type: article
    location: "Sections 2-4: Propositions 3.1, 3.2, 4.1, 4.2, 4.4, Algorithms 2.2 and 4.3"
    relationship: formalizes
    note: >-
      The source paper, conditionally accepted by the International Journal of
      Number Theory (manuscript IJNT-D-26-00150). This repository is the Lean
      formalization referred to in that paper.
    author_endorsement: participated
  - title: "Polynomial Diophantine equations: a systematic approach"
    authors:
      - Bogdan Grechuk
    type: book
    id: "Springer, Cham, 2024"
    location: "Proposition 5.4 (Gauss's theorem on generalised Pell equations)"
    relationship: background
    note: >-
      Reference [9] of the paper. The paper appeals to Proposition 5.4 there for
      the infinitude of the solutions of a generalised Pell equation; the Lean
      development does not assume it, but proves it from scratch as
      SumSquaresPaper.genPell_infinite, and proves a residue-controlled
      refinement, SumSquaresPaper.genPell_infinite_cong.
  - title: On the shortest open cubic equations
    authors:
      - Bogdan Grechuk
      - Ashleigh Ratcliffe
    type: article
    id: "International Journal of Number Theory, 2026"
    relationship: background
    note: >-
      Reference [11] of the paper; background on the length ordering of
      Diophantine equations discussed in Section 1. Not used in any proof.

related_formalizations: []

status:
  scope: >-
    All mathematical statements of the paper's Sections 2-4 that are asserted as
    results are formalized and proved: Propositions 3.1, 3.2 (equations
    (14)-(17)), 4.1, 4.2, 4.4(a) and 4.4(b); Algorithms 2.2 and 4.3, each stated
    as a theorem whose hypotheses record the data produced by the algorithm's
    search steps; the sum-of-two-squares machinery of Section 2, including
    property (*) and the tangent identity; Gauss's theorem on generalised Pell
    equations and a residue-controlled refinement of it; the
    non-multiplicativity of the form 2y^2 + yz + 2z^2; and the degenerate case
    B^2 - 4AC = 0. Not formalized: the expository discussion, Table 1 (the list
    of remaining open equations of length 9), the survey of the literature in
    Section 1, and the closing remarks of Section 5, none of which assert a
    theorem. The search steps of the algorithms are not formalized as
    executable searches; the numerical data they produce (values of u, base
    solutions of the auxiliary equations, and so on) appear as explicit
    parameters in the applications.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: PolynomialValuesQuadraticForms.equation_2_infinite
      file: Solution.lean
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: PolynomialValuesQuadraticForms.sum_two_squares_x_pow_six_sub_four
      file: Solution.lean
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: PolynomialValuesQuadraticForms.prop_4_1_general_form
      file: Solution.lean
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: comparator.json
      literature_dependencies: []
    - declaration: PolynomialValuesQuadraticForms.prop_4_2_auxiliary_equation
      file: Solution.lean
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: comparator.json
      literature_dependencies: []

automation:
  methods:
    - method: agent
      framework: Aristotle (Harmonic)
      tool_setup: >-
        The Lean proofs were produced with Aristotle, working against Lean
        v4.28.0 and the Mathlib revision pinned in lake-manifest.json, and were
        reviewed and accepted by the authors.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
  notes: >-
    The statements were fixed by the authors from the paper; the proofs were
    obtained with automated assistance and are machine-checked in full. The
    four non-squareness facts needed for the applications (a = 17006096, 8320,
    208 and 80) were originally discharged with native_decide, which adds the
    axiom Lean.ofReduceBool; they are now proved from the bounds already given
    in the paper (for example 4123^2 < 17006096 < 4124^2) by the elementary
    lemma SumSquaresPaper.not_isSquare_of_between together with norm_num, so
    that no declaration in the development depends on any axiom beyond the
    standard three.

fidelity:
  divergences: >-
    The formalized statements are the paper's statements; two proofs are
    organised differently, and both differences are documented in the module
    docstring of RequestProject/Main.lean and at the declarations concerned.
    (1) Proposition 4.2: the paper applies Gauss's theorem to the conic (31) in
    the variables (x, w); the Lean proof completes the square and applies the
    residue-controlled Pell theorem genPell_infinite_cong, which is proved here
    from scratch (some positive power of the fundamental unit is congruent to
    (1, 0) modulo N, so the iterates stay in a fixed residue class). The Lean
    statement of Proposition 4.2 also records that the non-degeneracy
    assumption Delta != 0, a standing assumption of Section 4, is not needed for
    Proposition 4.2 itself. (2) Proposition 4.4 is verified directly from the
    explicit polynomial families displayed in the paper, each identity being
    closed by ring, rather than by re-running the tangent construction of
    Proposition 4.1. In addition, Gauss's theorem on generalised Pell equations,
    which the paper quotes from reference [9, Proposition 5.4], is proved from
    scratch here rather than assumed. Challenge.lean contains one deliberate
    sorry per advertised statement, as the Comparator convention requires;
    Solution.lean and the proof development in RequestProject/Main.lean contain
    none.

review:
  status: self-assessed
  reviewers:
    - Bogdan Grechuk
  notes: >-
    The Lean development is machine-checked: it builds with the pinned toolchain
    and Mathlib revision, contains no sorry outside Challenge.lean's deliberate
    placeholders, declares no axiom, and every compared declaration reduces to
    the three standard axioms propext, Classical.choice and Quot.sound. The
    correspondence between the paper's statements and the Lean statements has
    been checked by the authors and is tabulated under alignment below. The
    source paper is under peer review at the International Journal of Number
    Theory; no independent review of the Lean statements themselves has been
    carried out.

alignment:
  namespace: SumSquaresPaper
  comparator_namespace: PolynomialValuesQuadraticForms
  statements:
    - source: "Abstract; Section 3 (x^6 - 4 is a sum of two squares infinitely often)"
      lean: PolynomialValuesQuadraticForms.sum_two_squares_x_pow_six_sub_four
      module: Solution
      status: proved
      note: >-
        Proved in the development as SumSquaresPaper.odd_pow6_sub4_S2_infinite,
        which gives the stronger statement that infinitely many such x are odd.
    - source: "Proposition 3.1 (equation (2): y^2 + x^3 y + z^2 + 1 = 0)"
      lean: PolynomialValuesQuadraticForms.equation_2_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_1 in RequestProject/Main.lean.
    - source: "Proposition 3.2, equation (14)"
      lean: PolynomialValuesQuadraticForms.equation_14_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq14.
    - source: "Proposition 3.2, equation (15)"
      lean: PolynomialValuesQuadraticForms.equation_15_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq15.
    - source: "Proposition 3.2, equation (16)"
      lean: PolynomialValuesQuadraticForms.equation_16_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq16.
    - source: "Proposition 3.2, equation (17)"
      lean: PolynomialValuesQuadraticForms.equation_17_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq17.
    - source: "Proposition 4.1 (tangent construction for a general form)"
      lean: PolynomialValuesQuadraticForms.prop_4_1_general_form
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_4_1; the underlying algebraic identity is
        SumSquaresPaper.prop_4_1_core and the tangent point is constructed in
        SumSquaresPaper.prop_4_1_solution.
    - source: "Proposition 4.2 (auxiliary equation (30) with congruence conditions)"
      lean: PolynomialValuesQuadraticForms.prop_4_2_auxiliary_equation
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_4_2. Proved via the residue-controlled Pell theorem
        SumSquaresPaper.genPell_infinite_cong rather than via the conic (31);
        see fidelity.divergences.
    - source: "Proposition 4.4(a) (2y^2 + yz + 2z^2 = x^3 + 1)"
      lean: PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_add_one_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_4_4a; verified from the explicit family by ring.
    - source: "Proposition 4.4(b) (2y^2 + yz + 2z^2 = x^3 - 1)"
      lean: PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_sub_one_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_4_4b; verified from the explicit family by ring.
    - source: "Section 2, property (*) of the sums of two squares"
      lean: SumSquaresPaper.Sum2Sq.div
      module: RequestProject.Main
      status: proved
      note: >-
        If a and a*b are positive sums of two squares then so is b; proved from
        the prime-factorization criterion via a p-adic valuation argument. Not
        part of the Comparator surface.
    - source: "Section 2, Gauss's theorem for generalised Pell equations ([9, Prop. 5.4])"
      lean: SumSquaresPaper.genPell_infinite
      module: RequestProject.Main
      status: proved
      note: >-
        Quoted from the literature in the paper, proved from scratch here by
        iterating multiplication by a fundamental unit. The refinement
        SumSquaresPaper.genPell_infinite_cong controls the residue class of the
        solutions. Not part of the Comparator surface.
    - source: "Algorithm 2.2 (sum-of-two-squares recipe)"
      lean: SumSquaresPaper.algorithm_2_2
      module: RequestProject.Main
      status: adapted
      note: >-
        Stated as a theorem whose hypotheses record the data produced by the
        algorithm's search steps; the search itself is not formalized as an
        executable procedure. Not part of the Comparator surface.
    - source: "Algorithm 4.3 (general-form recipe)"
      lean: SumSquaresPaper.algorithm_4_3
      module: RequestProject.Main
      status: adapted
      note: >-
        As for Algorithm 2.2. Not part of the Comparator surface.
    - source: "Section 4, non-multiplicativity of 2y^2 + yz + 2z^2"
      lean: SumSquaresPaper.form2_not_multiplicative
      module: RequestProject.Main
      status: proved
      note: >-
        The form represents 2 but not 4. Not part of the Comparator surface.
    - source: "Section 4, the degenerate case B^2 - 4AC = 0"
      lean: SumSquaresPaper.degenerate_case
      module: RequestProject.Main
      status: proved
      note: >-
        With SumSquaresPaper.degenerate_factorization and
        SumSquaresPaper.degenerate_infinite_iff. Not part of the Comparator
        surface.

acknowledgements: >-
  Built on Mathlib. The Lean proofs were produced with Aristotle (Harmonic); the
  Comparator setup follows the Palomar registry conventions and the
  mathlib-initiative formalization.yaml format.
