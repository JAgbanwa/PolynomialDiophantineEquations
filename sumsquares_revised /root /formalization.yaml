# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Metadata for the Lean formalization accompanying the paper
# "On the polynomial values represented by quadratic forms"
# (Bogdan Grechuk and Jamal Agbanwa), in the mathlib-initiative
# formalization.yaml v0.4 self-reporting format.
version: "v0.4"

project:
  name: polynomial-values-represented-by-quadratic-forms
  description: >-
    Lean 4 formalization of the paper "On the polynomial values represented by
    quadratic forms". The development proves, with no sorry and no added axiom,
    that x^6 - 4 is a sum of two squares for infinitely many integers x, and
    hence that the Diophantine equation y^2 + x^3 y + z^2 + 1 = 0 has infinitely
    many integer solutions (Corollary 3.1: this was the shortest equation, in
    the paper's length ordering, whose finiteness problem was open). It also
    formalizes the four further length-9 equations of Corollary 3.2, the
    criteria of Section 2 (Propositions 2.2 and 2.3, and the residue-controlled
    generalized Pell lemma), the general tangent construction of Section 4 for
    an arbitrary non-degenerate binary quadratic form (Propositions 4.1, 4.2 and
    Algorithms 2.4, 4.3), the two equations 2y^2 + yz + 2z^2 = x^3 +- 1 of
    Proposition 4.4, the non-multiplicativity of the form 2y^2 + yz + 2z^2, the
    degenerate case of a form of discriminant zero (Proposition 4.5), and the
    limitation recorded in Section 1 for x^6 + 3. Supporting theory proved from
    scratch includes property (*) of the sums of two squares and Gauss's theorem
    on generalised Pell equations, together with a residue-controlled refinement
    of the latter.
  authors:
    - Bogdan Grechuk
    - Jamal Agbanwa
  responsible_maintainers:
    - Bogdan Grechuk
  # No LICENSE file has been added to this repository yet; the licence is for
  # the authors to choose, and a LICENSE file at the repository root should be
  # added (and this field updated to match) before any registry submission.
  license: "unspecified: add a LICENSE file at the repository root and record it here"

repository:
  role: substantive-development

classification:
  arxiv: ["math.NT"]
  msc2020: ["11D09", "11D45", "11E16", "11D25"]

sources:
  - title: On the polynomial values represented by quadratic forms
    authors:
      - Bogdan Grechuk
      - Jamal Agbanwa
    type: article
    location: "Sections 1-4: Propositions 2.2, 2.3, 4.1, 4.2, 4.4, 4.5, Corollaries 3.1 and 3.2, Algorithms 2.4 and 4.3"
    relationship: formalizes
    note: >-
      The source paper, conditionally accepted by the International Journal of
      Number Theory (manuscript IJNT-D-26-00150). This repository is the Lean
      formalization referred to in that paper.
    author_endorsement: participated
  - title: "Polynomial Diophantine equations: a systematic approach"
    authors:
      - Bogdan Grechuk
    type: book
    id: "Springer, Cham, 2024"
    location: "Proposition 5.4 (Gauss's theorem on generalised Pell equations)"
    relationship: background
    note: >-
      Reference [11] of the paper. The paper appeals to Proposition 5.4 there for
      the infinitude of the solutions of a generalised Pell equation; the Lean
      development does not assume it, but proves it from scratch as
      SumSquaresPaper.genPell_infinite, and proves a residue-controlled
      refinement, SumSquaresPaper.genPell_infinite_cong.
  - title: On the shortest open cubic equations
    authors:
      - Bogdan Grechuk
      - Ashleigh Ratcliffe
    type: article
    id: "International Journal of Number Theory, 2026"
    relationship: background
    note: >-
      Reference [13] of the paper; background on the length ordering of
      Diophantine equations discussed in Section 1. Not used in any proof.

related_formalizations: []

status:
  scope: >-
    All mathematical statements of the paper's Sections 1-4 that are asserted as
    results are formalized and proved: Propositions 2.2, 2.3, 4.1, 4.2, 4.4(a),
    4.4(b) and 4.5; Corollaries 3.1 and 3.2 (equations (16)-(19)); the
    residue-controlled generalized Pell lemma of Section 2; the observation of
    Section 1 that the method does not resolve y^2 + z^2 = x^6 + 3;
    Algorithms 2.4 and 4.3, each stated
    as a theorem whose hypotheses record the data produced by the algorithm's
    search steps; the sum-of-two-squares machinery of Section 2, including
    property (*) and the tangent identity; Gauss's theorem on generalised Pell
    equations and a residue-controlled refinement of it; the
    non-multiplicativity of the form 2y^2 + yz + 2z^2; and the degenerate case
    B^2 - 4AC = 0. Not formalized: the expository discussion, Table 1 (the list
    of remaining open equations of length 9), the survey of the literature in
    Section 1, and the closing remarks of Section 5, none of which assert a
    theorem. The search steps of the algorithms are not formalized as
    executable searches; the numerical data they produce (values of u, base
    solutions of the auxiliary equations, and so on) appear as explicit
    parameters in the applications.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: PolynomialValuesQuadraticForms.equation_2_infinite
