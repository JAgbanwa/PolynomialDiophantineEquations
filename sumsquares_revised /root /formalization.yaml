automation:
  methods:
    - method: agent
      framework: Aristotle (Harmonic)
      tool_setup: >-
        The Lean proofs were produced with Aristotle, working against Lean
        v4.28.0 and the Mathlib revision pinned in lake-manifest.json, and were
        reviewed and accepted by the authors.
      cost:
        wall_time: not tracked
        spend_usd: not tracked
  notes: >-
    The statements were fixed by the authors from the paper; the proofs were
    obtained with automated assistance and are machine-checked in full. The
    four non-squareness facts needed for the applications (a = 17006096, 8320,
    208 and 80) were originally discharged with native_decide, which adds the
    axiom Lean.ofReduceBool; they are now proved from the bounds already given
    in the paper (for example 4123^2 < 17006096 < 4124^2) by the elementary
    lemma SumSquaresPaper.not_isSquare_of_between together with norm_num, so
    that no declaration in the development depends on any axiom beyond the
    standard three.

fidelity:
  divergences: >-
    The formalized statements are the paper's statements; two proofs are
    organised differently, and both differences are documented in the module
    docstring of RequestProject/Main.lean and at the declarations concerned.
    (1) Proposition 4.2: the paper applies Gauss's theorem to the conic (31) in
    the variables (x, w); the Lean proof completes the square and applies the
    residue-controlled Pell theorem genPell_infinite_cong, which is proved here
    from scratch (some positive power of the fundamental unit is congruent to
    (1, 0) modulo N, so the iterates stay in a fixed residue class). The Lean
    statement of Proposition 4.2 also records that the non-degeneracy
    assumption Delta != 0, a standing assumption of Section 4, is not needed for
    Proposition 4.2 itself. (2) Proposition 4.4 is verified directly from the
    explicit polynomial families displayed in the paper, each identity being
    closed by ring, rather than by re-running the tangent construction of
    Proposition 4.1. In addition, Gauss's theorem on generalised Pell equations,
    which the paper quotes from reference [11, Proposition 5.4], is proved from
    scratch here rather than assumed. Challenge.lean contains one deliberate
    sorry per advertised statement, as the Comparator convention requires;
    Solution.lean and the proof development in RequestProject/Main.lean contain
    none.

review:
  status: self-assessed
  reviewers:
    - Bogdan Grechuk
  notes: >-
    The Lean development is machine-checked: it builds with the pinned toolchain
    and Mathlib revision, contains no sorry outside Challenge.lean's deliberate
    placeholders, declares no axiom, and every compared declaration reduces to
    the three standard axioms propext, Classical.choice and Quot.sound. The
    correspondence between the paper's statements and the Lean statements has
    been checked by the authors and is tabulated under alignment below. The
    source paper is under peer review at the International Journal of Number
    Theory; no independent review of the Lean statements themselves has been
    carried out.

alignment:
  namespace: SumSquaresPaper
  comparator_namespace: PolynomialValuesQuadraticForms
  statements:
    - source: "Abstract; Section 3 (x^6 - 4 is a sum of two squares infinitely often)"
      lean: PolynomialValuesQuadraticForms.sum_two_squares_x_pow_six_sub_four
      module: Solution
      status: proved
      note: >-
        Proved in the development as SumSquaresPaper.odd_pow6_sub4_S2_infinite,
        which gives the stronger statement that infinitely many such x are odd.
    - source: "Corollary 3.1 (equation (2): y^2 + x^3 y + z^2 + 1 = 0)"
      lean: PolynomialValuesQuadraticForms.equation_2_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_1 in RequestProject/Main.lean.
    - source: "Corollary 3.2, equation (16) (equation (14) in the first version)"
      lean: PolynomialValuesQuadraticForms.equation_14_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq14.
    - source: "Corollary 3.2, equation (17) (equation (15) in the first version)"
      lean: PolynomialValuesQuadraticForms.equation_15_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq15.
    - source: "Corollary 3.2, equation (18) (equation (16) in the first version)"
      lean: PolynomialValuesQuadraticForms.equation_16_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq16.
    - source: "Corollary 3.2, equation (19) (equation (17) in the first version)"
      lean: PolynomialValuesQuadraticForms.equation_17_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_3_2_eq17.
    - source: "Proposition 4.1 (tangent construction for a general form)"
      lean: PolynomialValuesQuadraticForms.prop_4_1_general_form
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_4_1; the underlying algebraic identity is
        SumSquaresPaper.prop_4_1_core and the tangent point is constructed in
        SumSquaresPaper.prop_4_1_solution.
    - source: "Proposition 4.2 (auxiliary equation (30) with congruence conditions)"
      lean: PolynomialValuesQuadraticForms.prop_4_2_auxiliary_equation
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_4_2. Proved via the residue-controlled Pell theorem
        SumSquaresPaper.genPell_infinite_cong rather than via the conic (31);
        see fidelity.divergences.
    - source: "Proposition 4.4(a) (2y^2 + yz + 2z^2 = x^3 + 1)"
      lean: PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_add_one_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_4_4a; verified from the explicit family by ring.
    - source: "Proposition 4.4(b) (2y^2 + yz + 2z^2 = x^3 - 1)"
      lean: PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_sub_one_infinite
      module: Solution
      status: proved
      note: SumSquaresPaper.prop_4_4b; verified from the explicit family by ring.
    - source: "Section 2, property (*) of the sums of two squares"
      lean: SumSquaresPaper.Sum2Sq.div
      module: RequestProject.Main
      status: proved
      note: >-
        If a and a*b are positive sums of two squares then so is b; proved from
        the prime-factorization criterion via a p-adic valuation argument. Not
        part of the Comparator surface.
    - source: "Section 2, Gauss's theorem for generalised Pell equations ([11, Prop. 5.4])"
      lean: SumSquaresPaper.genPell_infinite
      module: RequestProject.Main
      status: proved
      note: >-
        Quoted from the literature in the paper, proved from scratch here by
        iterating multiplication by a fundamental unit. The refinement
        SumSquaresPaper.genPell_infinite_cong controls the residue class of the
        solutions. Not part of the Comparator surface.
    - source: "Proposition 2.2 (sum-of-two-squares criterion)"
      lean: PolynomialValuesQuadraticForms.prop_2_2_sum_two_squares_criterion
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_2_2. The paper's proof discards the finitely many x
        with R(Q(x)) = 0 using that R o Q is non-constant; the Lean proof needs
        no such hypothesis, since 0 is itself a sum of two squares.
    - source: "Proposition 2.3 (a x^2 + b x + c = v^2 under conditions (a)-(c))"
      lean: PolynomialValuesQuadraticForms.prop_2_3_auxiliary_equation
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_2_3; the conclusion records both the infinitude of
        the solution pairs and the infinitude of their x-coordinates.
    - source: "Section 2, residue-controlled generalized Pell lemma"
      lean: PolynomialValuesQuadraticForms.residue_controlled_pell_lemma
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.residue_controlled_pell, the paper's formulation of
        SumSquaresPaper.genPell_infinite_cong.
    - source: "Section 1, the method does not resolve y^2 + z^2 = x^6 + 3 (equation (6))"
      lean: SumSquaresPaper.pow6_add3_algorithm_fails
      module: RequestProject.Main
      status: proved
      note: >-
        For even u the value u^3 + 3 is 3 mod 4 and hence not a sum of two
        squares; for odd u the auxiliary expression is 3 mod 4 for every x and
        hence never a square. Not part of the Comparator surface.
    - source: "Algorithm 2.4 (sum-of-two-squares recipe)"
      lean: PolynomialValuesQuadraticForms.algorithm_2_4_correct
      module: Solution
      status: adapted
      note: >-
        SumSquaresPaper.algorithm_2_4, stated as a theorem whose hypotheses
        record the data produced by the algorithm's search steps; the search
        itself is not formalized as an executable procedure.
    - source: "Algorithm 4.3 (general-form recipe)"
      lean: PolynomialValuesQuadraticForms.algorithm_4_3_correct
      module: Solution
      status: adapted
      note: >-
        SumSquaresPaper.algorithm_4_3; as for Algorithm 2.4.
    - source: "Section 4, non-multiplicativity of 2y^2 + yz + 2z^2"
      lean: SumSquaresPaper.form2_not_multiplicative
      module: RequestProject.Main
      status: proved
      note: >-
        The form represents 2 but not 4; as in the paper, the obstruction is
        modulo 3 (SumSquaresPaper.form2_not_one_mod_three, with the identity
        4(y^2 - yz + z^2) = (2y - z)^2 + 3z^2 recorded as
        SumSquaresPaper.form2_identity). Not part of the Comparator surface.
    - source: "Proposition 4.5, the degenerate case B^2 - 4AC = 0"
      lean: PolynomialValuesQuadraticForms.prop_4_5_degenerate_case
      module: Solution
      status: proved
      note: >-
        SumSquaresPaper.prop_4_5, built from
        SumSquaresPaper.degenerate_factorization,
        SumSquaresPaper.degenerate_reduces,
        SumSquaresPaper.degenerate_infinite_iff and
        SumSquaresPaper.degenerate_case.

