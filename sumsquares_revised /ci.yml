name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the Lean project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan (pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build RequestProject, Challenge and Solution
        run: lake build
      - name: Check that only the standard axioms are used
        run: |
          cat > axioms.lean <<'LEAN'
          import Solution
          #print axioms PolynomialValuesQuadraticForms.sum_two_squares_x_pow_six_sub_four
          #print axioms PolynomialValuesQuadraticForms.equation_2_infinite
          #print axioms PolynomialValuesQuadraticForms.equation_14_infinite
          #print axioms PolynomialValuesQuadraticForms.equation_15_infinite
          #print axioms PolynomialValuesQuadraticForms.equation_16_infinite
          #print axioms PolynomialValuesQuadraticForms.equation_17_infinite
          #print axioms PolynomialValuesQuadraticForms.prop_4_1_general_form
          #print axioms PolynomialValuesQuadraticForms.prop_4_2_auxiliary_equation
          #print axioms PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_add_one_infinite
          #print axioms PolynomialValuesQuadraticForms.form_2_1_2_eq_cube_sub_one_infinite
          LEAN
          lake env lean axioms.lean | tee axioms.out
          # The only axioms allowed are propext, Classical.choice and Quot.sound.
          if grep -E 'sorryAx|ofReduceBool|trustCompiler' axioms.out; then
            echo "unexpected axiom dependency"; exit 1
          fi
          if [ "$(grep -c 'depends on axioms' axioms.out)" -ne 10 ]; then
            echo "expected an axiom report for each compared declaration"; exit 1
          fi
      - name: Check that the development is free of sorry and axiom declarations
        run: |
          ! grep -rn --include=*.lean -E '\bsorry\b|\badmit\b|^axiom ' RequestProject Solution.lean

  comparator:
    name: Compare Challenge.lean against Solution.lean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install elan (pinned by lean-toolchain)
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run comparator
        run: ./verify.sh
