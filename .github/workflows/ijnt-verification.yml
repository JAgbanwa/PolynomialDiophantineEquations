name: IJNT isolated verification

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/ijnt-verification.yml"]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'ijnt-verify-20260907'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ijnt-verify-20260907
      - name: Apply the pinned-Mathlib compatibility correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sumsquares_revised/RequestProject/Main.lean')
          s = p.read_text()
          old = 'Set.mem_ofPred_eq'
          n = s.count(old)
          assert n in (0, 6), f'Unexpected occurrence count: {n}'
          if n:
              p.write_text(s.replace(old, 'Set.mem_setOf_eq'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add sumsquares_revised/RequestProject/Main.lean
            git commit -m 'Fix six set-membership simplifications for pinned Mathlib 4.28.0'
            git push origin HEAD:ijnt-verify-20260907
          fi
          mkdir -p verification
          git rev-parse HEAD | tee verification/checked-commit.txt
          sha256sum sumsquares_revised/RequestProject/Main.lean | tee verification/main-sha256.txt
      - name: Install Lean and restore dependencies
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: sumsquares_revised
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: Check proof modules with warnings treated as errors
        working-directory: sumsquares_revised
        run: |
          set -euo pipefail
          lake env lean --version | tee ../verification/lean-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee ../verification/mathlib-commit.txt
          lake build RequestProject Solution 2>&1 | tee ../verification/proof-build.log
          lake env lean -DwarningAsError=true RequestProject/Main.lean 2>&1 | tee ../verification/main-strict.log
          lake env lean -DwarningAsError=true Solution.lean 2>&1 | tee ../verification/solution-strict.log
          printf 'All three proof commands exited 0.\n' | tee ../verification/proof-status.txt
      - name: Audit all advertised theorem axioms
        working-directory: sumsquares_revised
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('Solution.lean').read_text()
          names = re.findall(r'^theorem\s+(\w+)', s, re.M)
          assert len(names) == 16, names
          Path('AxiomAudit.lean').write_text('import Solution\n' + ''.join('#print axioms PolynomialValuesQuadraticForms.'+n+'\n' for n in names))
          PY
          lake env lean AxiomAudit.lean 2>&1 | tee ../verification/axioms.log
          if grep -E 'sorryAx|Lean.ofReduceBool' ../verification/axioms.log; then exit 1; fi
          rm AxiomAudit.lean
      - name: Run the independent statement comparator
        working-directory: sumsquares_revised
        env:
          COMPARATOR_SKIP_CACHE: "1"
        run: |
          set -euo pipefail
          bash verify.sh 2>&1 | tee ../verification/comparator.log
      - name: Package checked sources and verification evidence
        if: always()
        run: |
          git archive HEAD sumsquares_revised > verification/project-source.tar
          cp sumsquares_revised/RequestProject/Main.lean verification/Main.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ijnt-checked-sources-and-logs
          path: verification/
          retention-days: 30
