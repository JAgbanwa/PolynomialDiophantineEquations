name = "RequestProject"
defaultTargets = ["RequestProject", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# The formal development: all mathematical work is in `RequestProject/Main.lean`.
[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

# Comparator setup: statements with `sorry` proofs.
[[lean_lib]]
name = "Challenge"

# Comparator setup: the same statements, proved via `RequestProject/Main.lean`.
[[lean_lib]]
name = "Solution"
