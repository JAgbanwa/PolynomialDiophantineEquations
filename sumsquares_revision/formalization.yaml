version: v0.4
project:
  name: polynomial-values-represented-by-binary-quadratic-forms
  description: Lean formalization of the paper by Bogdan Grechuk and Jamal Agbanwa. The development covers
    the sum-of-two-squares criteria and applications, the tangent construction for general integral binary
    quadratic forms, conditional correctness of the two algorithms, and the if-and-only-if criterion for
    degenerate forms. The comparison interface has 42 theorem statements.
  authors:
  - Bogdan Grechuk
  - Jamal Agbanwa
  license: Unspecified; no license file is present in this repository.
repository:
  role: substantive-development
classification:
  arxiv:
  - math.NT
  msc2020:
  - 11D09
  - 11D45
sources:
- title: On the polynomial values represented by binary quadratic forms
  authors:
  - Bogdan Grechuk
  - Jamal Agbanwa
  type: article
  id: International Journal of Number Theory manuscript IJNT-D-26-00150, revision R1
  location: 'Sections 2-4: Propositions 2.2, 2.3, 4.1, 4.2 and 4.4; Corollaries 3.1 and 3.2; Algorithms
    2.4 and 4.3; the degenerate case and supporting identities.'
  relationship: formalizes
  author_endorsement: participated
  note: The current declaration names and source labels follow the supplied manuscript and R1 referee
    report. The sum-of-two-squares criterion and auxiliary seed criterion are Propositions 2.2 and 2.3;
    the algorithms are 2.4 and 4.3, and the explicit-family result is Proposition 4.4. The immutable paper
    snapshot 85b3903f4af4424be7939ff9eaee3b6c0dd2c7ab retains its earlier identifiers; README.md records
    their correspondence with the current names. Source-author participation refers to Jamal Agbanwa;
    this entry does not claim an independent review of the Lean statements.
- title: 'Polynomial Diophantine equations: a systematic approach'
  authors:
  - Bogdan Grechuk
  type: book
  id: Springer, Cham, 2024
  location: Propositions 5.4 and 3.14, cited in the paper for the auxiliary infinitude results; Proposition
    3.67, cited for the reduced degenerate equation.
  relationship: background
  note: Reference [11] of the paper. The formalization supplies its own Pell-orbit argument for the two
    infinitude results, using Mathlib, rather than assuming these cited results as axioms. The general
    algorithm referred to in Proposition 3.67 is not implemented.
automation:
  methods:
  - method: agent
    framework: Aristotle (Harmonic)
    tool_setup: Original formal proof development assisted by Aristotle, as reported by the author. Run-level
      models, prompts, costs and timings were not recorded in this repository.
  - method: agent
    framework: ChatGPT
    tool_setup: Assisted audit against the supplied manuscript and referee report, source documentation and packaging
      corrections, independent statement interface, metadata, and reproducibility checks.
  notes: Toolchain and dependency revisions are recorded by lean-toolchain and lake-manifest.json. Build
    and comparator commands are documented in README.md and verify.sh.
status:
  scope: 'The 42 declarations below cover the main results in Sections 2-4 and supporting identities,
    the prime-exponent criterion and property (*) for positive sums of two squares, both tangent criteria,
    both seed-infinitude criteria, the two algorithms as conditional correctness implications, quadratic
    reduction for admissible degree pairs, finite seed tests in the linear case, the applications of Corollaries
    3.1 and 3.2 and Proposition 4.4, the obstruction for x^6+3, non-multiplicativity examples, and the
    parametrization and if-and-only-if criterion for degenerate forms. Not included: executable general
    seed searches or quadratic-equation decision procedures; the claim that u=50 is the smallest successful
    seed for x^6-4; the literature survey, length-ordering discussion and Table 1 of remaining open problems.
    The sufficient seed u=162 used in the proof is included.'
