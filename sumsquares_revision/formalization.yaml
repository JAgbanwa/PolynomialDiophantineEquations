not_formalised:
  - "Section 1: informal discussion (lengths of equations, Table 1 of open equations)"
  - "Footnote to Corollary 3.1: u = 50 is the smallest seed satisfying Algorithm 2.1 for f = -4 (the proof uses u = 162, which is formalised)"

notes:
  - "Proposition 2.2 (case a > 0) and Proposition 4.2 (case a != 0), for which the paper cites [11, Proposition 5.4] and Gauss's theorem [11, Proposition 3.14] respectively, are proved in Main.lean from a Pell-equation lemma (PolyQF.pell_orbit_infinite); no external result is assumed."
  - "Proposition 4.2 is stated with the hypothesis m != 0 only (the paper has m = F(p, q))."
