# Metadata for the Lean formalisation of the paper (format version 0.4).
version: "0.4"

paper:
  title: "On the polynomial values represented by binary quadratic forms"
  authors:
    - "Bogdan Grechuk"
    - "Jamal Agbanwa"
  revision: "R1"
  journal: "International Journal of Number Theory (submission IJNT-D-26-00150)"

lean:
  toolchain: "leanprover/lean4:v4.28.0"
  mathlib: "v4.28.0"
  build: "lake build"

repository:
  # Cite one and the same commit in both links of footnote b and in the README:
  # the commit that contains this file together with all files listed under `files`.
  commit: null

files:
  main: "RequestProject/Main.lean"
  challenge: "Challenge.lean"
  solution: "Solution.lean"
  comparator_config: "comparator.json"
  verification_script: "verify.sh"
  offline_check: "scripts/CheckComparator.lean"

definitions:
  - name: "PolyQF.S2"
    paper: "S_2, the set of positive integers that are sums of two squares"
  - name: "PolyQF.Du"
    paper: "the polynomial D_u of equation (6)"
  - name: "PolyQF.bqf"
    paper: "the binary quadratic form F(y, z) = A y^2 + B y z + C z^2 of (17)"
  - name: "PolyQF.AdmissibleDegrees"
    paper: "the degree pairs (3,1), (4,1), (3,2) of Algorithms 2.1 and 4.1"

axioms:
  permitted:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"

results:
  - paper: "Equation (6)"
    challenge: "Paper.taylor_identity"
    proof: "PolyQF.taylor_identity"
    status: "proved"
  - paper: "Equation (6), uniqueness of D_u"
    challenge: "Paper.Du_unique"
    proof: "PolyQF.Du_unique"
    status: "proved"
  - paper: "Section 2, deg D_u <= deg R - 2"
