  - paper: "Equation (7)"
    challenge: "Paper.tangent_identity"
    proof: "PolyQF.tangent_identity"
    status: "proved"
  - paper: "Section 3, D_u for R(t) = t^3 + f"
    challenge: "Paper.Du_cubic"
    proof: "PolyQF.Du_cubic"
    status: "proved"
  - paper: "Section 3, passage from (8) to (12)"
