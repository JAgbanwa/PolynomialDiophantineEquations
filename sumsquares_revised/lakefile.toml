name = "RequestProject"
version = "0.1.0"
defaultTargets = ["RequestProject", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject", "RequestProject.*"]
leanOptions = {warningAsError = true}

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
leanOptions = {warningAsError = true}

