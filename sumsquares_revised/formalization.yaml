paper:
  title: "On the polynomial values represented by quadratic forms"
  authors:
    - "Bogdan Grechuk"
    - "Jamal Agbanwa"
  file: "On_the_polynomial_values_represented_by_quadratic_forms_new.pdf"

project:
  lean_toolchain: "leanprover/lean4:v4.28.0"
  mathlib_rev: "v4.28.0"
  entry_point: "RequestProject.lean"
  self_contained_statements: "RequestProject.lean (namespace Challenge)"
  solutions: "RequestProject.lean (namespace Solution)"

definitions:
  - name: "PolyQF.S2"
    file: "RequestProject.lean"
    paper_reference: "Section 2, the set S₂"
    description: "Positive integers representable as a sum of two integer squares."
  - name: "PolyQF.BQF"
    file: "RequestProject.lean"
    paper_reference: "equation (19)"
    description: "The binary quadratic form F(y,z) = A y² + B y z + C z²."
  - name: "PolyQF.disc"
    file: "RequestProject.lean"
    paper_reference: "Section 4, discriminant"
    description: "The discriminant Δ = B² − 4AC."

